<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive loop from the Hubble Deep Field to a paper earth on a wall, the room inside you, the globe, the moon and the pale blue dot.">
<title>You Are Here</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500;600&family=VT323&display=swap">
<style>
/* Full-bleed exhibit: one fixed layer per scene, stacked; a black world except the paper-white room.
   Loop: galaxy → (pinhole) → inside you → globe → moon → pale blue dot → galaxy */
:root {
  --void: #000000;          /* space */
  --paper: #fdf4ea;         /* inside "you": paper with the faintest coffee stain */
  --signal: #ff3326;        /* the red square, you, my life */
  --ink: #141414;           /* the line, the room text */
  --halftone: #ff7a1a;      /* orange dot field */
  --dim-ink: rgba(20, 20, 20, 0.45);
  --f-display: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-vhs: "VT323", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--void); color: #eceef5; overflow: hidden; font-family: var(--f-display); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible { outline: 1px dashed var(--signal); outline-offset: 6px; }

.layer { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity .8s ease; }
.layer.on { opacity: 1; pointer-events: auto; }
.layer.instant { transition: none; }

/* galaxy */
#s-deep { z-index: 6; background: var(--void); cursor: pointer; overflow: hidden; }
#s-deep .plate { position: absolute; inset: -6%; background: url(img/deepfield.jpg) center / cover no-repeat;
  /* a soft black vignette that belongs to the field itself: no edge of the image ever shows, at rest or while it grows */
  -webkit-mask-image: radial-gradient(ellipse farthest-corner at 50% 50%, #000 40%, rgba(0,0,0,.55) 57%, transparent 70%);
          mask-image: radial-gradient(ellipse farthest-corner at 50% 50%, #000 40%, rgba(0,0,0,.55) 57%, transparent 70%);
  transform: translate(var(--px, 0px), var(--py, 0px)) scale(var(--ds, 1)); will-change: transform; }
#s-deep .drift { position: absolute; inset: 0; animation: drift 70s ease-in-out infinite alternate; }
#s-deep.hold .drift { animation-play-state: paused; }
@keyframes drift { from { transform: scale(1.02) translate(0, 0); } to { transform: scale(1.12) translate(-1.5%, 1%); } }

/* credit for the reel this is after: quiet, top right of the opening screen only */
#cite { position: absolute; z-index: 2; top: calc(18px + env(safe-area-inset-top, 0px)); right: 20px; font-family: var(--f-display); font-size: 13px;
  letter-spacing: .02em; color: rgba(236, 238, 245, .42); text-decoration: none; transition: color .3s; }
#cite:hover, #cite:focus-visible { color: rgba(236, 238, 245, .85); text-decoration: underline; text-underline-offset: 3px; }
#blind { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; background: #000; }
/* the pale blue dot on its own, held over the dark while the galaxies open around it */
#lone { position: fixed; z-index: 8; left: 0; top: 0; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: #f4f8ff; box-shadow: 0 0 3px 1px rgba(205, 222, 255, .75), 0 0 10px 2px rgba(160, 190, 255, .25); }

/* pale blue dot, suspended in a pillar of dust */
#s-pbd { z-index: 5; background: #000; overflow: hidden; cursor: pointer; }
#pbd { position: absolute; max-width: none; transform-origin: 0 0; will-change: transform, filter; filter: brightness(1.3); }

/* globe and moon share one WebGL canvas */
#s-globe { z-index: 4; background: var(--void); touch-action: none; cursor: grab; }
#s-globe.dragging { cursor: grabbing; }
#s-globe.moon { cursor: pointer; }
#globe { display: block; width: 100%; height: 100%; }

/* the room inside the square */
#s-room { z-index: 20; background: var(--paper); color: var(--ink); transition: none; }

/* the wall: a paper earth pinned up, polaroids pinned beside it; whatever is unpinned falls out of frame */
#s-wall { z-index: 21; background-color: var(--paper); color: var(--ink); transition: none; overflow: hidden; perspective: 1400px; }
#s-wall.fading { transition: background-color 1.4s ease; background-color: rgba(253, 244, 234, 0); }
.w-obj { position: absolute; left: 0; top: 0; transform-style: preserve-3d; will-change: transform; opacity: 0; transition: opacity .8s ease; }
/* the photos and the earth are drawn in 3D from the start; these DOM elements are only their hit targets */
#wall-earth { filter: drop-shadow(7px 12px 10px rgba(70, 45, 20, .22)) drop-shadow(1px 2px 1px rgba(70, 45, 20, .18)); }
#wall-earth img { display: block; width: 100%; height: auto; pointer-events: none; user-select: none; }
.polaroid { background: #fbfaf6; box-sizing: border-box; touch-action: none; user-select: none;
  box-shadow: 0 1px 1px rgba(60, 40, 20, .18), 4px 9px 14px rgba(60, 40, 20, .2); }
.polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; pointer-events: none; filter: saturate(.92) contrast(.97); }
.polaroid .shade { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(165deg, rgba(255, 255, 255, 0) 10%, rgba(40, 28, 16, .55) 100%); }
.polaroid.free { cursor: grab; }
.polaroid.held { cursor: grabbing; }
/* pins and anything falling are drawn by a three.js layer; these buttons are just the hit targets over the pin heads */
#wall-gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 35; }
.pin { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; padding: 0; border: 0; border-radius: 50%;
  background: none; z-index: 40; cursor: pointer; }
.pin:focus-visible { outline: 1px dashed var(--signal); outline-offset: 2px; }
.pin.out { pointer-events: none; }
.w-obj.ghost { opacity: 0 !important; transition: none; }
#wall-words { position: absolute; right: 5%; bottom: 8%; margin: 0; font-size: clamp(22px, 2.6vw, 40px); font-weight: 500; letter-spacing: -0.01em;
  opacity: 0; transform-origin: 0 50%; }
#wall-words.on { animation: crt-on .62s cubic-bezier(.2,.7,.3,1) forwards; }
#wall-words .crt { animation: none; padding: .25em .6em; margin: -.25em -.6em; }
#room-c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
#worries { position: absolute; left: 55%; right: 3%; top: 9%; bottom: 9%; margin: 0; padding: 0; list-style: none;
  font-size: clamp(26px, 3.4vw, 54px); font-weight: 500; line-height: 1; letter-spacing: -0.01em; pointer-events: none; }
#worries li { position: absolute; left: var(--x); top: var(--y); white-space: nowrap; opacity: 0; transform-origin: 0 50%; pointer-events: auto; cursor: default; }
#worries li.me { font-size: 2.4em; font-weight: 600; letter-spacing: -0.02em; }
#worries li.on { animation: crt-on .62s cubic-bezier(.2,.7,.3,1) forwards; }
#worries li.off { animation: crt-off .36s ease-in forwards; }
#worries .crt { animation: none; padding: .25em .6em; margin: -.25em -.6em; }   /* no periodic jitter; padding keeps glitch offsets inside the mask */
#worries .ch { display: inline-block; transform-origin: 50% 82%; transition: scale .2s cubic-bezier(.3,1.6,.5,1); }
#worries .ch:hover { scale: 1.6; position: relative; z-index: 1; }
#worries li.glitch .crt-ink { text-shadow: -3px 0 rgba(255, 0, 70, .7), 3px 0 rgba(0, 170, 255, .7), 0 0 1px rgba(0,0,0,.5); }
#worries li.glitch .crt-red { text-shadow: -3px 0 rgba(255, 0, 140, .75), 3px 0 rgba(0, 200, 255, .55), 0 0 10px rgba(255, 40, 20, .4); }
#worries li.glitch .crt { -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 1px, rgba(0,0,0,.3) 1px 2px);
                                  mask-image: repeating-linear-gradient(180deg, #000 0 1px, rgba(0,0,0,.3) 1px 2px); }
#worries li.glitch .ch { animation: ch-glitch .34s steps(1) infinite; animation-delay: calc(var(--i) * -61ms); }
#worries li.glitch .ch:hover { animation-duration: .17s; }
@keyframes ch-glitch {
  0% { transform: none; clip-path: none; }
  18% { transform: translate(3px, 0) skewX(-9deg); clip-path: inset(8% 0 48% 0); }
  36% { transform: translate(-4px, 1px); clip-path: none; }
  54% { transform: translate(1px, -1px) skewX(7deg); clip-path: inset(52% 0 4% 0); }
  72% { transform: translate(-2px, 0); clip-path: inset(0 0 30% 0); }
  90% { transform: translate(2px, 0); clip-path: none; } }
#leave { display: none; position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px; font-size: 22px; color: var(--dim-ink); width: 40px; height: 40px; }
@media (hover: none) { #s-room.ready #leave { display: block; } }
@media (max-width: 760px) and (max-aspect-ratio: 23/20) {
  #worries { left: 16px; right: 16px; top: 58%; bottom: 4%; font-size: clamp(24px, 7vw, 40px); }
  #worries li.me { font-size: 2em; }
}

/* CRT treatment: only on the red marks and the room words, never the whole scene */
.crt { display: inline-block; position: relative;
  -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 2px, rgba(0,0,0,.34) 2px 3px);
          mask-image: repeating-linear-gradient(180deg, #000 0 2px, rgba(0,0,0,.34) 2px 3px);
  animation: flicker 5.3s infinite, jitter 7.1s infinite; }
.crt-signal { color: var(--signal); filter: drop-shadow(0 0 3px rgba(255, 50, 30, .65)) drop-shadow(0 0 10px rgba(255, 40, 20, .3));
  text-shadow: -1px 0 rgba(255, 0, 120, .55), 1px 0 rgba(255, 170, 40, .45); }
.crt-ink { color: var(--ink); text-shadow: -1.2px 0 rgba(255, 0, 70, .38), 1.2px 0 rgba(0, 150, 255, .38), 0 0 1px rgba(0,0,0,.5); }
.crt-red { color: var(--signal); text-shadow: -1.2px 0 rgba(255, 0, 140, .45), 1.2px 0 rgba(255, 160, 0, .45), 0 0 10px rgba(255, 40, 20, .35); }
@keyframes flicker { 0%, 100% { opacity: 1; } 41% { opacity: 1; } 42% { opacity: .82; } 43% { opacity: 1; } 77% { opacity: .94; } 78% { opacity: 1; } }
@keyframes jitter { 0%, 95%, 100% { transform: translateX(0); } 96% { transform: translateX(1.6px); } 97% { transform: translateX(-1px); } 98% { transform: translateX(.5px); } }
@keyframes crt-on { 0% { opacity: 0; transform: scale(.5, .02); filter: brightness(3); } 30% { opacity: 1; transform: scale(1, .02); }
  70% { transform: scale(1, 1.08); filter: brightness(1.6); } 100% { opacity: 1; transform: none; filter: none; } }
@keyframes crt-off { 0% { opacity: 1; transform: none; } 45% { opacity: 1; transform: scale(1, .02); filter: brightness(2.6); } 100% { opacity: 0; transform: scale(0, .02); } }

/* VHS caption over the turning planet */
/* hand-drawn callouts pinned to places on the turning globe */
#notes { position: fixed; inset: 0; z-index: 24; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#notes .note { opacity: 0; transition: opacity .45s ease; }
#notes .note.on { opacity: 1; }
#notes path { fill: none; stroke: rgba(238, 238, 232, .86); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; filter: url(#pencil);
  stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .6s cubic-bezier(.6,0,.2,1); }
#notes .note.on path { stroke-dashoffset: 0; }
#notes circle { fill: none; stroke: rgba(238, 238, 232, .92); stroke-width: 2.2; filter: url(#pencil); }
#notes text { fill: #f3f3ee; font: 600 13px var(--f-display); letter-spacing: .01em; opacity: 0; transition: opacity .35s ease .25s;
  paint-order: stroke; stroke: rgba(0, 0, 0, .65); stroke-width: 3px; stroke-linejoin: round; }
#notes .note.on text { opacity: 1; }
#vhs { position: fixed; z-index: 26; top: calc(22px + env(safe-area-inset-top, 0px)); left: 8px; margin: 0; pointer-events: none;
  font-family: var(--f-vhs); font-size: clamp(26px, 2.8vw, 40px); line-height: 1; color: #f2f2ee; letter-spacing: .02em; text-transform: lowercase;
  text-shadow: -2px 0 rgba(255, 20, 70, .8), 2px 0 rgba(0, 210, 255, .75), 0 0 8px rgba(255, 255, 255, .4);
  -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 1px, rgba(0,0,0,.42) 1px 2px);
          mask-image: repeating-linear-gradient(180deg, #000 0 1px, rgba(0,0,0,.42) 1px 2px);
  opacity: 0; transition: opacity 1.2s ease; padding: 10px 48px 10px 24px; }
#vhs.show { opacity: 1; animation: vhs-wobble 4.7s infinite; }
#vhs span { display: block; filter: blur(.35px); }
#vhs::after { content: attr(data-text); position: absolute; left: 24px; top: 10px; color: #f2f2ee; filter: blur(.5px);
  text-shadow: -3px 0 rgba(255, 20, 70, .9), 3px 0 rgba(0, 210, 255, .85); clip-path: inset(100% 0 0 0); animation: vhs-track 3.9s infinite steps(1); }
@keyframes vhs-wobble { 0%, 100% { transform: translateX(0) skewX(0); } 31% { transform: translateX(0); } 32% { transform: translateX(-2px) skewX(-2deg); }
  33% { transform: translateX(1px); } 34% { transform: none; } 71% { transform: translateX(.6px); } 72% { transform: none; } }
@keyframes vhs-track { 0% { clip-path: inset(100% 0 0 0); transform: none; } 30% { clip-path: inset(15% 0 70% 0); transform: translateX(7px); }
  33% { clip-path: inset(55% 0 30% 0); transform: translateX(-5px); } 36% { clip-path: inset(100% 0 0 0); } 80% { clip-path: inset(72% 0 12% 0); transform: translateX(4px); } 82% { clip-path: inset(100% 0 0 0); } }

/* red marks */
.mark { position: fixed; left: 0; top: 0; z-index: 25; pointer-events: none; opacity: 0; transition: opacity .5s; }
.mark.show { opacity: 1; }
.mark .crt { display: block; padding: 40px 44px 14px; margin: -40px -44px -14px; } /* room for label + glow inside the scanline mask */
.mark svg { display: block; overflow: visible; }
.mark rect { fill: none; stroke: var(--signal); stroke-width: 1.6; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1s cubic-bezier(.6,0,.2,1); }
.mark.show rect { stroke-dashoffset: 0; }
.mark-label { position: absolute; left: 50%; bottom: calc(100% - 40px); translate: -50% -6px; font-weight: 600; letter-spacing: .14em;
  padding-left: .14em; white-space: nowrap; opacity: 0; text-transform: lowercase; }
.mark.show .mark-label { animation: crt-on .5s .75s cubic-bezier(.2,.7,.3,1) forwards; }

#pbd-mark .mark-label { font-size: 18px; }
#pbd-words { position: absolute; left: 7%; top: 50%; transform: translateY(-50%); margin: 0; z-index: 2; color: #f2f2ee; pointer-events: none;
  font-family: var(--f-display); font-size: clamp(30px, 3.8vw, 58px); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; text-transform: lowercase;
  text-shadow: 0 0 18px rgba(0, 0, 0, .6); }

#moon-mark .mark-label { font-size: 15px; letter-spacing: .1em; }
#moon-mark .crt { padding: 40px 180px 14px; margin: -40px -180px -14px; }
#globe-mark { pointer-events: none; transition: none; }
#globe-mark rect { stroke-dashoffset: 0; transition: none; }
#globe-mark .mark-label { animation: none !important; opacity: 1; }
#globe-mark.show.facing { pointer-events: auto; cursor: pointer; }
#globe-mark .fill { position: absolute; left: 1px; top: 1px; width: 24px; height: 24px; background: var(--paper); transition: transform .25s ease; }
#globe-mark .mark-label { font-size: 15px; letter-spacing: .12em; translate: -50% -4px; }
#globe-mark .box-wrap { transition: transform .25s ease; }
#globe-mark:hover .box-wrap, #globe-mark:focus-visible .box-wrap, #globe-mark:hover .fill, #globe-mark:focus-visible .fill { transform: scale(1.18); }

#portal { position: fixed; z-index: 30; background: var(--paper); border: 1.6px solid var(--signal); box-sizing: border-box; display: none; }

@media (prefers-reduced-motion: reduce) {
  #s-deep .drift, .crt, #vhs.show, #vhs::after, #worries li.glitch .ch { animation: none; }
}
</style>
</head>
<body>
<section id="s-deep" class="layer on" aria-label="hubble extreme deep field. click to go in.">
  <div class="drift"><div class="plate"></div></div>
  <a id="cite" href="https://www.tiktok.com/@sopaguada/video/7690600273236004103" target="_blank" rel="noopener">after a reel by @sopaguada</a>
</section>
<div id="blind"></div>
<div id="lone" aria-hidden="true"></div>

<section id="s-pbd" class="layer" aria-label="pale blue dot. click to zoom out.">
  <img id="pbd" src="img/paleblue.jpg" alt="earth as a single point of light suspended in a tall pillar of dust between black space">
  <p id="pbd-words" aria-live="polite"></p>
</section>
<div id="pbd-mark" class="mark" aria-hidden="true">
  <div class="crt crt-signal">
    <span class="mark-label">you</span>
    <svg width="42" height="42" viewBox="0 0 42 42"><rect x="0.8" y="0.8" width="40.4" height="40.4" pathLength="100"/></svg>
  </div>
</div>

<section id="s-globe" class="layer" aria-label="earth. drag to spin it, or click empty space to zoom out.">
  <canvas id="globe"></canvas>
</section>
<p id="vhs" data-text="that's a whole planet"><span>that's a whole planet</span></p>
<svg id="notes" aria-hidden="true">
  <defs><filter id="pencil" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.8"/>
  </filter></defs>
</svg>
<button id="globe-mark" class="mark" aria-label="go into you">
  <span class="fill"></span>
  <div class="crt crt-signal">
    <span class="mark-label">you</span>
    <div class="box-wrap"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="0.8" y="0.8" width="24.4" height="24.4" pathLength="100"/></svg></div>
  </div>
</button>

<div id="moon-mark" class="mark" aria-hidden="true">
  <div class="crt crt-signal">
    <span class="mark-label">everybody who has ever lived</span>
    <svg width="60" height="60" viewBox="0 0 60 60"><rect x="0.8" y="0.8" width="58.4" height="58.4" pathLength="100"/></svg>
  </div>
</div>

<section id="s-wall" class="layer" aria-label="a paper earth pinned to the wall beside five photographs. take out the earth's pin to go on.">
  <div id="wall-earth" class="w-obj"><img src="img/paperearth.webp" alt="a child's pencil drawing of the earth, cut out of paper"></div>
  <div class="polaroid w-obj" data-k="dunes"><img src="img/p_dunes.jpg" alt="the crest of a sand dune"><i class="shade"></i></div>
  <div class="polaroid w-obj" data-k="butterfly"><img src="img/p_butterfly.jpg" alt="a butterfly on a leaf"><i class="shade"></i></div>
  <div class="polaroid w-obj" data-k="glacier"><img src="img/p_glacier.jpg" alt="a glacier"><i class="shade"></i></div>
  <div class="polaroid w-obj" data-k="hands"><img src="img/p_hands.jpg" alt="two hands almost touching"><i class="shade"></i></div>
  <div class="polaroid w-obj" data-k="sunset"><img src="img/p_sunset.jpg" alt="a sunset over the sea"><i class="shade"></i></div>
  <p id="wall-words"><span class="crt crt-ink">this is all we have</span></p>
</section>

<section id="s-room" class="layer" aria-label="inside you">
  <canvas id="room-c"></canvas>
  <ol id="worries">
    <li class="me" style="--x: 4%; --y: 6%"><span class="crt crt-ink">me</span></li>
    <li style="--x: 36%; --y: 40%"><span class="crt crt-ink">my worries</span></li>
    <li style="--x: 9%; --y: 57%"><span class="crt crt-ink">my fears</span></li>
    <li style="--x: 44%; --y: 77%"><span class="crt crt-red">my life</span></li>
  </ol>
  <button id="leave" aria-label="zoom out">×</button>
</section>

<div id="portal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = ms => RM ? ms * 0.35 : ms;
const sleep = ms => new Promise(r => setTimeout(r, T(ms)));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  in2: t => t * t,
  in3: t => t * t * t,
  out3: t => 1 - Math.pow(1 - t, 3),
  out4: t => 1 - Math.pow(1 - t, 4),
  sine: t => .5 - Math.cos(Math.PI * t) / 2,
};
function tween(ms, fn, ease = E.inOut) {
  return new Promise(res => {
    const d = T(ms); let s = null;
    const f = now => { if (s === null) s = now; const t = Math.min(1, (now - s) / d); fn(ease(t), t); t < 1 ? requestAnimationFrame(f) : res(); };
    requestAnimationFrame(f);
  });
}
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

const deep = $('#s-deep'), deepPlate = $('#s-deep .plate'), blind = $('#blind');
const pbdL = $('#s-pbd'), pbdImg = $('#pbd'), pbdMark = $('#pbd-mark');
const globeL = $('#s-globe'), globeMark = $('#globe-mark'), vhs = $('#vhs'), moonMark = $('#moon-mark'), moonSvg = $('#moon-mark svg'), moonRect = $('#moon-mark rect');
const room = $('#s-room'), portal = $('#portal');

let scene = 'deep', busy = false;

/* ---------- galaxy ---------- */
// the galaxy the pinhole closes on, in deepfield.jpg pixels (2000 × 1512)
const GAL = { x: 1030, y: 723, w: 2000, h: 1512 };
function galaxyPt() {
  const r = deepPlate.getBoundingClientRect(), w0 = deepPlate.offsetWidth, h0 = deepPlate.offsetHeight;
  const s = Math.max(w0 / GAL.w, h0 / GAL.h);
  const ox = (w0 - GAL.w * s) / 2 + GAL.x * s, oy = (h0 - GAL.h * s) / 2 + GAL.y * s;
  return { x: r.left + ox * r.width / w0, y: r.top + oy * r.height / h0, ox, oy };
}

/* ---------- pale blue dot layout ---------- */

    ctx.drawImage(lineC, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

const lineC = document.createElement('canvas'), lctx = lineC.getContext('2d');
let scanP = null, scanFor = 0;

  const g = c.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.42)'; g.fillRect(0, c.height - Math.max(1, Math.round(DPR / 1.5)), 1, Math.max(1, Math.round(DPR / 1.5)));

let rLast = 0;
function roomLoop(now) {
  if (!roomOn) return;
  const dt = Math.min(.05, (now - rLast) / 1000); rLast = now;
  advance(dt); physics(); drawRoom();
  requestAnimationFrame(roomLoop);
}

// words: split into letters; hovering a letter grows it and sends its word into heavy VHS glitching
const lines = [...document.querySelectorAll('#worries li')];
lines.forEach(li => {
  const span = li.querySelector('.crt'), text = span.textContent; span.textContent = '';
  [...text].forEach((ch, i) => {
    if (ch === ' ') { span.append(' '); return; }
    const s = document.createElement('span'); s.className = 'ch'; s.style.setProperty('--i', i); s.textContent = ch; span.append(s);
  });
  li.addEventListener('pointerenter', () => li.classList.add('glitch'));
  li.addEventListener('pointerleave', () => li.classList.remove('glitch'));
});

async function roomIntro() {
  layoutRoom();
  dotsP = 0; tangleScale = 1; tangleReveal = 0; tangleAlpha = 1; seedLine();
  lines.forEach(l => { l.classList.remove('on', 'off', 'glitch'); });
  roomOn = true; rLast = performance.now(); requestAnimationFrame(roomLoop);
  // one thing at a time, unhurried: the dots, then the line, then each word
  await tween(2000, k => { dotsP = k; }, E.out3);
  await sleep(700);
  await tween(2200, k => { tangleReveal = k; }, E.inOut);
  await sleep(900);
  for (const l of lines) { l.classList.add('on'); await sleep(l === lines[0] ? 1500 : 1200); }
  room.classList.add('ready');
}
async function roomOutro() {
  for (const l of [...lines].reverse()) { l.classList.remove('on', 'glitch'); l.classList.add('off'); await sleep(170); }
  await sleep(220);
  burning = true;   // the line burns down from its tail like a wick, still moving, until nothing is left
  await tween(1800, k => { tangleReveal = 1 - k; }, t => t * (.6 + .4 * t));
  burning = false;
  await sleep(150);
  await tween(1100, k => { dotsP = 1 - k; }, E.inOut);                                     // then the dots

  roomOn = false;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, rc.width, rc.height);
  await sleep(250);
}

/* ---------- 3 → 4 · pull back from the globe onto the moon ---------- */
const MOON = { z: 42, h: 1.0, fov: 22, pitch: -.05 };
async function toMoon() {
  if (scene !== 'globe' || busy) return;
  busy = true; scene = 'leaving'; spaceMoving = true;
  globeMark.classList.remove('show'); vhs.classList.remove('show');
  const z0 = cam.pos.z;
  moon.position.set(0, -MOON.h - 12, MOON.z); moon.visible = true;
  globeL.classList.add('moon');
  await tween(5200, k => {
    cam.pos.set(0, 0, lerp(z0, MOON.z, k));
    cam.fov = lerp(35, MOON.fov, k);
    cam.look.set(0, Math.tan(MOON.pitch) * MOON.z * k, 0);
    moon.position.y = -MOON.h - 12 * Math.pow(1 - k, 2.2);
  }, E.sine);
  scene = 'moon'; spaceMoving = false;
  updateMoonMark(); moonMark.classList.add('show');
  await sleep(1500);
  busy = false;
}

/* ---------- 4 → 5 · rise off the moon, swing round until it hides behind the earth, let the earth shrink to a bright point, cut to the dot ---------- */
function resetSpace() {
  tiltG.position.set(0, 0, 0); tiltG.scale.setScalar(1);
  SUN.copy(SUN0); sunLight.position.copy(SUN).multiplyScalar(10);
  EXPOSURE.value = 1; PALE.value = 0; glow.visible = false; glow.material.opacity = 0;
}
async function moonToDot() {
  if (scene !== 'moon' || busy) return;
  busy = true; scene = 'leaving'; spaceMoving = true;
  moonMark.classList.remove('show');
  {
    const dist = cam.pos.distanceTo(cam.look);
    cam.look.x += Math.tan(cam.yaw) * dist; cam.look.y += Math.tan(cam.pitch) * dist;
    cam.tyaw = cam.tpitch = 0; cam.yaw = cam.pitch = 0;
  }
  layoutPBD();
  // Invisible rescale: grow the earth about the eye and push it out along the same sight line.
  // Nothing on screen changes, but earth and moon are now at believable relative sizes and distances.
  const F = 600, Eye = cam.pos.clone();
  const look0 = Eye.clone().add(cam.look.clone().sub(Eye).multiplyScalar(F));
  tiltG.position.copy(Eye).multiplyScalar(1 - F); tiltG.scale.setScalar(F);
  const Ce = tiltG.position.clone(), base = Eye.clone().sub(Ce).normalize();
  const R0 = Eye.distanceTo(Ce), R1 = R0 * 45, f0 = cam.fov;
  const Y = new THREE.Vector3(0, 1, 0), fwd = new THREE.Vector3(), right = new THREE.Vector3(), up = new THREE.Vector3(), aim = new THREE.Vector3();
  const sm = (a, b, v) => { const q = clamp((v - a) / (b - a), 0, 1); return q * q * (3 - 2 * q); };
  glow.visible = true;
  const M0 = moon.position.clone(), D0 = R0;           // moon centre sits 200 below its patch origin
  const aimS = look0.clone(), cE = new THREE.Vector3(), cM = new THREE.Vector3();
  let fovS = f0, tPrev = performance.now();
  await tween(7000, (_, t) => {
    const now = performance.now(), dt = Math.min(.05, (now - tPrev) / 1000); tPrev = now;
    // the moon falls away toward the earth as we lift off it, settling into a tight orbit
    const Dm = lerp(D0, 6000, E.inOut(clamp(t / .55, 0, 1)));
    moon.position.copy(Ce).addScaledVector(base, Dm); moon.position.y += M0.y;
    // swing round the earth until the moon is directly behind it, drawing back the whole time
    const th = Math.PI * E.inOut(clamp((t - .1) / .72, 0, 1));
    const R = R0 * Math.pow(R1 / R0, E.in2(t));
    cam.pos.copy(Ce).addScaledVector(base.clone().applyAxisAngle(Y, th), R);
    cam.pos.y += R * .12 * Math.sin(Math.PI * t) * sm(.15, .5, t);   // stay low over the surface at first, rise later
    // the sun turns with us so the earth's face stays lit from the upper left
    SUN.copy(SUN0).applyAxisAngle(Y, th); sunLight.position.copy(SUN).multiplyScalar(10);
    // aim between earth and moon, then onto the earth, then slide it to where the pale blue dot will be
    const w = .45 * sm(0, .2, t) * (1 - sm(.5, .82, t));   // aim takes the moon in from the start
    cM.copy(moon.position).y -= 200;
    const target = Ce.clone().lerp(cM, w);
    target.lerp(look0, 1 - E.inOut(clamp(t / .25, 0, 1)));
    const s = E.inOut(clamp((t - .74) / .24, 0, 1));
    if (s > 0) {
      fwd.copy(Ce).sub(cam.pos).normalize(); right.crossVectors(fwd, Y).normalize(); up.crossVectors(right, fwd);
      const nx = earthPt.x / innerWidth * 2 - 1, ny = 1 - earthPt.y / innerHeight * 2;
      const ty = Math.tan(fovS * Math.PI / 360), tx = ty * innerWidth / innerHeight, dist = cam.pos.distanceTo(Ce);
      target.lerp(Ce, s).addScaledVector(right, -nx * tx * dist * s).addScaledVector(up, -ny * ty * dist * s);
    }
    // frame from the bodies' real angular positions: wide enough to hold both, never narrower than 7°
    const dE = cam.pos.distanceTo(Ce), dM = cam.pos.distanceTo(cM);
    cE.copy(Ce).sub(cam.pos).normalize(); fwd.copy(cM).sub(cam.pos).normalize();
    const sep = Math.acos(clamp(cE.dot(fwd), -1, 1)), rE = Math.atan(600 / dE), rM = Math.atan(200 / Math.max(dM, 201));
    const half = Math.max(w * sep + rE, (1 - w) * sep * (1 - s) + rM * (1 - s)) * 1.3;
    const fovT = lerp(f0, clamp(THREE.MathUtils.radToDeg(2 * half), 7, 60), E.inOut(clamp(t / .3, 0, 1)));

    // the follow tightens toward the end so the earth lands on the dot's position without a snap
    const tight = sm(.86, 1, t);

    aimS.lerp(target, t < .02 ? 0 : aA); fovS += (fovT - fovS) * aF;
    cam.look.copy(aimS); cam.fov = fovS;
    const b = sm(.55, .95, t);

  }, x => x);
  // cutover: the bright point becomes the dot in the dust
  spaceMoving = false; drag.on = false; globeL.classList.remove('dragging');
  pbdImg.style.transition = 'none'; pbdImg.style.transform = 'none'; pbdImg.style.filter = 'brightness(1.3)';
  pbdL.style.opacity = '0'; pbdL.classList.add('instant', 'on');
  await tween(1000, k => { pbdL.style.opacity = String(k); globeL.style.opacity = String(1 - k); }, E.inOut);
  globeL.classList.add('instant'); globeL.classList.remove('on', 'moon'); globeL.style.opacity = '';
  pbdL.style.opacity = ''; pbdL.classList.remove('instant');
  globeOn = false; moon.visible = false; resetSpace();
  await nextFrame(); globeL.classList.remove('instant');
  scene = 'pbd';
  await sleep(600);
  await typeWords();
  busy = false;
}
// letter by letter, no cursor, with a longer breath before the ":" and the ")"
let typeTok = 0;
async function typeWords() {
  const el = $('#pbd-words'), tok = ++typeTok, text = 'maybe you\nshould\nworry less\n:)';
  el.textContent = '';
  for (const ch of text) {
    let d = 70 + Math.random() * 60;
    if (ch === ' ') d = 150; else if (ch === '\n') d = 420; else if (ch === ':') d = 900; else if (ch === ')') d = 1100;
    await sleep(d);
    if (tok !== typeTok) return;
    el.append(ch === '\n' ? document.createElement('br') : ch);
  }
}

/* ---------- 5 → 1 · out past the dot to the galaxies again ---------- */
async function dotToGalaxy() {
  if (scene !== 'pbd' || busy) return;
  typeTok++;
  busy = true; scene = 'leaving';
  pbdMark.classList.remove('show');
  const lone = $('#lone'), sm = (a, b, v) => { const q = clamp((v - a) / (b - a), 0, 1); return q * q * (3 - 2 * q); };
  lone.style.transform = `translate(${earthPt.x}px, ${earthPt.y}px)`; lone.style.opacity = '1';
  // the dust thins away, leaving the dot alone in the dark
  pbdImg.style.transition = 'none';
  await tween(1500, k => {
    pbdImg.style.filter = `brightness(${(1.3 * (1 - k)).toFixed(3)})`;
    pbdImg.style.transform = `scale(${1 - .05 * k})`;
  }, E.inOut);
  pbdL.classList.add('instant'); pbdL.classList.remove('on');
  await sleep(500);
  // the dot becomes the galaxy we first fell into: the field starts shrunk to a point under the dot,
  // then grows to full size and glides back to its resting place (the field's own black needs no mask)
  deep.classList.add('hold');
  deepPlate.style.setProperty('--ds', 1); deepPlate.style.setProperty('--px', '0px'); deepPlate.style.setProperty('--py', '0px');
  deep.style.clipPath = ''; deep.style.opacity = '0';
  deep.classList.add('instant', 'on');
  const G = galaxyPt(), pr = deepPlate.getBoundingClientRect(), driftS = pr.width / deepPlate.offsetWidth;
  deepPlate.style.transformOrigin = `${G.ox}px ${G.oy}px`;
  const w0 = deepPlate.offsetWidth, h0 = deepPlate.offsetHeight;
  await tween(2800, k => {
    const e = E.inOut(k), sc = .04 * Math.pow(25, E.inOut(k));     // 0.04 → 1, exponential so it reads as one steady zoom
    const qx = lerp(earthPt.x, G.x, e), qy = lerp(earthPt.y, G.y, e);
    deepPlate.style.setProperty('--px', ((qx - G.x) / driftS).toFixed(2) + 'px');
    deepPlate.style.setProperty('--py', ((qy - G.y) / driftS).toFixed(2) + 'px');
    deepPlate.style.setProperty('--ds', sc.toFixed(4));
    deep.style.opacity = String(sm(0, .15, k));
    lone.style.opacity = String(1 - sm(0, .3, k));
  }, x => x);
  deep.style.opacity = ''; deep.classList.remove('instant', 'hold');
  deepPlate.style.setProperty('--px', '0px'); deepPlate.style.setProperty('--py', '0px'); deepPlate.style.setProperty('--ds', 1);
  lone.style.opacity = '0';
  pbdImg.style.transform = 'none'; pbdImg.style.filter = 'brightness(1.3)'; pbdL.classList.remove('instant');

  busy = false;
}

/* ---------- wiring ---------- */
$('#cite').addEventListener('click', e => e.stopPropagation());
deep.addEventListener('click', galaxyToRoom);
pbdL.addEventListener('click', dotToGalaxy);
addEventListener('keydown', e => {
  if (e.key === 'Escape') { roomToGlobe(); return; }
  if (busy || !(e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter')) return;
  if (e.target.closest && e.target.closest('.pin')) return;   // pins handle their own keys
  if (e.key === 'Enter' && document.activeElement === globeMark) return; // button handles it
  e.preventDefault();
  if (scene === 'deep') galaxyToRoom();
  else if (scene === 'wall') wallToRoom();
  else if (scene === 'room') roomToGlobe();
  else if (scene === 'globe') e.key === 'Enter' ? globeToRoom() : toMoon();
  else if (scene === 'moon') moonToDot();
  else if (scene === 'pbd') dotToGalaxy();
});
addEventListener('resize', () => {
  layoutPBD();
  if (renderer) {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    if (scene === 'globe') cam.pos.z = zBase() * zoomF;
  }
  if (roomOn) { layoutRoom(); seedLine(); }
  if (wallOn) wallLayout(); else sizeWallGL();
});
})();
